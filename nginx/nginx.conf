events {}

http {
    include       /etc/nginx/mime.types;    # ← Move it here (top of http block)
    default_type  application/octet-stream;  # ← Good to add this as fallback
    upstream backend_cluster {
        # Docker DNS resolves backend to multiple containers automatically
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # Force correct MIME for JS/CSS (defensive – good practice)
        location ~* \.(js|jsx|mjs)$ {
            types { application/javascript js jsx mjs; }
        }

        location ~* \.(css)$ {
            types { text/css css; }
        }

        # API → backend load balancing
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend static files
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
